name: Build Pico FIDO ESP32-S3
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build and merge binary with ESP-IDF v5.5.4
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.4
          target: esp32s3
          command: |
            idf.py set-target esp32s3
            idf.py all
            mkdir -p release
            cd build
            esptool.py --chip ESP32-S3 merge_bin -o ../release/pico_fido_esp32s3.bin @flash_args

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pico-fido-esp32s3
          path: release/pico_fido_esp32s3.bin
